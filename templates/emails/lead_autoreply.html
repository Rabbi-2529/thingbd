<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f6f5fa;font-family:Arial,Helvetica,sans-serif;color:#17141f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e7e5ef;border-radius:12px;">
    <tr>
      <td style="padding:20px 24px;background:#0e0c15;border-radius:12px 12px 0 0;">
        <span style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:8px;background:#8b5cf6;color:#fff;font-weight:bold;">{{ site.site_name|first }}</span>
        <strong style="margin-left:8px;font-size:16px;color:#ffffff;">{{ site.site_name }}</strong>
      </td>
    </tr>
    <tr>
      <td style="padding:24px;font-size:15px;line-height:1.65;">{{ body|linebreaks }}</td>
    </tr>
    <tr>
      <td style="padding:16px 24px;border-top:1px solid #e7e5ef;color:#7a7589;font-size:12px;">
        {{ site.tagline }}{% if site.email %} · <a href="mailto:{{ site.email }}" style="color:#6d28d9;">{{ site.email }}</a>{% endif %}{% if site.phone %} · {{ site.phone }}{% endif %}
      </td>
    </tr>
  </table>
</body>
</html>
