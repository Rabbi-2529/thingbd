<header class="topbar">
  <button class="icon-button sidebar-toggle" type="button" data-sidebar-toggle aria-controls="sidebar" aria-label="Open menu">
    <span class="icon">menu</span>
  </button>

  <div class="topbar-title">{{ page_title }}</div>

  <div class="topbar-actions">
    <button class="icon-button" type="button" data-theme-toggle aria-label="Toggle dark mode">
      <span class="icon theme-icon-light">dark_mode</span>
      <span class="icon theme-icon-dark">light_mode</span>
    </button>

    <div class="user-menu" data-dropdown>
      <button class="user-button" type="button" data-dropdown-toggle aria-haspopup="true" aria-expanded="false">
        <span class="avatar">{% firstof request.user.first_name|first request.user.username|first %}</span>
        <span class="user-name">{% firstof request.user.get_full_name request.user.username %}</span>
        <span class="icon">expand_more</span>
      </button>
      <div class="dropdown" role="menu">
        <div class="dropdown-header">
          <strong>{% firstof request.user.get_full_name request.user.username %}</strong>
          <small>{{ request.user.email|default:"No email set" }}</small>
        </div>
        <a href="{% url 'dashboard:profile' %}" role="menuitem"><span class="icon">person</span>My profile</a>
        <a href="{% url 'dashboard:password_change' %}" role="menuitem"><span class="icon">lock</span>Change password</a>
        <form method="post" action="{% url 'dashboard:logout' %}">
          {% csrf_token %}
          <button type="submit" role="menuitem"><span class="icon">logout</span>Log out</button>
        </form>
      </div>
    </div>
  </div>
</header>
