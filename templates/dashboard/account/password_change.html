{% extends "dashboard/base.html" %}

{% block subheading %}<p class="muted">Use at least 8 characters that are not easy to guess.</p>{% endblock %}

{% block content %}
  <form method="post" class="card form-card narrow" novalidate>
    {% csrf_token %}
    <div class="form-body form-stack">
      {% for field in form %}{% include "dashboard/partials/field.html" %}{% endfor %}
    </div>
    <div class="form-actions">
      <a class="button button-ghost" href="{% url 'dashboard:index' %}">Cancel</a>
      <button type="submit" class="button button-primary"><span class="icon">lock_reset</span> Update password</button>
    </div>
  </form>
{% endblock %}
